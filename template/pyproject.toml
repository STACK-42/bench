[project]
name = "competition"
version = "0.1.0"
description = "CHANGE-ME: one sentence saying what this competition asks for"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "mlflow>=2.17",
    "kaggle>=2.2.5",
]

[project.scripts]
comp = "comp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comp"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "experiments"]
# Recent ruff versions also format code blocks inside Markdown. Notes and
# documents are not ours to reformat, so leave them alone.
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
